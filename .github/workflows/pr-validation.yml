name: PR Validation

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main, develop]
  push:
    branches: [develop]

env:
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
  JWT_ISSUER: tech-challenge-auth
  JWT_AUDIENCE: tech-challenge-api

jobs:
  titulo-conventional-commits:
    name: Título Conventional Commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Validar título do PR
        env:
          TITULO: ${{ github.event.pull_request.title }}
        run: |
          if ! echo "$TITULO" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._-]+\))?: .+'; then
            echo "Título fora do Conventional Commits: $TITULO"
            echo "Esperado: tipo(escopo opcional): descrição — ex. feat(os): adiciona pool explícito no Prisma"
            exit 1
          fi

  validate:
    name: Lint, Build e Testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn prisma generate
      - run: yarn prisma migrate deploy
      - run: yarn lint
      - run: yarn build
      - run: yarn test:cov
      - run: yarn test:int
      - run: yarn test:e2e

      # - name: Auditoria npm (alta/critica)
      #   run: yarn audit --level high
      #   continue-on-error: false

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: SonarCloud Quality Gate
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  security-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: trufflesecurity/trufflehog@v3.82.13
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: HEAD
          extra_args: --only-verified
