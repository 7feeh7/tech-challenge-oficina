name: Terraform OS

# plan, apply e destroy da pasta terraform/ (fila os-in e DLQ), só por disparo manual.
# Somente main + environment producao. Nenhum plan automático em PR: a validação
# (fmt e validate, sem credencial) fica no pr-validation.yml.
on:
  workflow_dispatch:
    inputs:
      action:
        description: Ação Terraform
        required: true
        default: plan
        type: choice
        options: [plan, apply, destroy]
      confirm_destroy:
        description: Digite DESTRUIR-tech-challenge-oficina para confirmar destroy
        required: false
        type: string

env:
  AWS_REGION: us-east-1
  TF_VERSION: 1.15.8
  TF_ENVIRONMENT: producao
  TF_STATE_KEY: tech-challenge-oficina/producao/terraform.tfstate

concurrency:
  group: os-terraform-producao
  cancel-in-progress: false

jobs:
  validar-entrada:
    # Roda antes do job com environment para que um destroy sem confirmação falhe
    # sem esperar aprovação e sem assumir a role.
    name: Validar entrada
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Validar confirmação de destroy
        if: github.event.inputs.action == 'destroy'
        env:
          CONFIRMACAO: ${{ github.event.inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRMACAO" != "DESTRUIR-tech-challenge-oficina" ]; then
            echo "Confirmação de destroy inválida ou ausente."
            echo "Digite exatamente: DESTRUIR-tech-challenge-oficina"
            exit 1
          fi

  terraform:
    name: Terraform
    needs: validar-entrada
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: terraform
        run: |
          terraform init \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ env.TF_STATE_KEY }}" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_STATE_LOCK_TABLE }}"

      - name: Terraform Plan
        if: github.event.inputs.action == 'plan' || github.event.inputs.action == 'apply'
        working-directory: terraform
        run: |
          terraform plan -no-color \
            -var="environment=${{ env.TF_ENVIRONMENT }}" \
            -out=tfplan

      - name: Terraform Apply
        if: github.event.inputs.action == 'apply'
        working-directory: terraform
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy
        if: github.event.inputs.action == 'destroy'
        working-directory: terraform
        run: |
          terraform destroy -auto-approve \
            -var="environment=${{ env.TF_ENVIRONMENT }}"

      - name: Smoke — parâmetros SSM da fila os-in
        if: github.event.inputs.action == 'apply'
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          aws ssm get-parameter --name "${PREFIX}/infra/os_in_queue_url" --query Parameter.Name --output text
          aws ssm get-parameter --name "${PREFIX}/infra/os_in_dlq_url" --query Parameter.Name --output text
