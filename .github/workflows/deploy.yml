name: Deploy Application

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  K8S_NAMESPACE: oficina
  TF_ENVIRONMENT: producao

concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  test:
    name: Build e Testes
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - run: yarn install --frozen-lockfile
      - run: yarn prisma generate
      - run: yarn lint
      - run: yarn build
      - run: yarn test:cov

  deploy:
    name: Deploy no EKS
    needs: test
    runs-on: ubuntu-latest
    environment: producao
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolver parametros via SSM
        id: ssm
        run: |
          PREFIX="/tech-challenge/${{ env.TF_ENVIRONMENT }}"
          ECR=$(aws ssm get-parameter --name "${PREFIX}/infra/ecr_repository_url" --query Parameter.Value --output text)
          EKS=$(aws ssm get-parameter --name "${PREFIX}/infra/eks_cluster_name" --query Parameter.Value --output text)
          DB_ARN=$(aws ssm get-parameter --name "${PREFIX}/database/db_secret_arn" --query Parameter.Value --output text)
          JWT_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/jwt_secret_arn" --query Parameter.Value --output text)
          SNS_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/sns_notificacao_topic_arn" --query Parameter.Value --output text)
          IRSA_ARN=$(aws ssm get-parameter --name "${PREFIX}/infra/api_notificacao_irsa_role_arn" --query Parameter.Value --output text)
          API_GATEWAY_URL=$(aws ssm get-parameter --name "${PREFIX}/infra/api_gateway_url" --query Parameter.Value --output text)
          echo "ecr=$ECR" >> $GITHUB_OUTPUT
          echo "eks=$EKS" >> $GITHUB_OUTPUT
          echo "db_arn=$DB_ARN" >> $GITHUB_OUTPUT
          echo "jwt_arn=$JWT_ARN" >> $GITHUB_OUTPUT
          echo "sns_arn=$SNS_ARN" >> $GITHUB_OUTPUT
          echo "irsa_arn=$IRSA_ARN" >> $GITHUB_OUTPUT
          echo "api_gateway_url=$API_GATEWAY_URL" >> $GITHUB_OUTPUT

      - name: Montar DATABASE_URL a partir do Secrets Manager
        id: db
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id "${{ steps.ssm.outputs.db_arn }}" --query SecretString --output text)
          USER=$(echo "$SECRET" | jq -r .username)
          PASS=$(echo "$SECRET" | jq -r .password)
          HOST=$(echo "$SECRET" | jq -r .host)
          PORT=$(echo "$SECRET" | jq -r .port)
          DB=$(echo "$SECRET" | jq -r .dbname)
          URL="postgresql://${USER}:${PASS}@${HOST}:${PORT}/${DB}?schema=public&connection_limit=5&pool_timeout=10"
          echo "database_url=$URL" >> $GITHUB_OUTPUT

      - name: Obter JWT do Secrets Manager
        id: jwt
        run: |
          SECRET=$(aws secretsmanager get-secret-value --secret-id "${{ steps.ssm.outputs.jwt_arn }}" --query SecretString --output text)
          JWT=$(echo "$SECRET" | jq -r .secret)
          echo "jwt_secret=$JWT" >> $GITHUB_OUTPUT

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build e push imagem (SHA imutavel)
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.ssm.outputs.ecr }}
        run: |
          docker build -t "$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REPOSITORY:latest" .
          docker push "$ECR_REPOSITORY:$IMAGE_TAG"
          docker push "$ECR_REPOSITORY:latest"

      - name: Configurar kubectl
        run: |
          aws eks update-kubeconfig \
            --region "$AWS_REGION" \
            --name "${{ steps.ssm.outputs.eks }}"

      - name: Namespace, ServiceAccount e ConfigMap
        env:
          SNS_ARN: ${{ steps.ssm.outputs.sns_arn }}
          IRSA_ARN: ${{ steps.ssm.outputs.irsa_arn }}
          API_GATEWAY_URL: ${{ steps.ssm.outputs.api_gateway_url }}
        run: |
          kubectl apply -f k8s/namespace.yaml
          sed "s|API_NOTIFICACAO_IRSA_ROLE_ARN|${IRSA_ARN}|g" k8s/serviceaccount.yaml | kubectl apply -f -
          sed -e "s|__SNS_NOTIFICACAO_TOPIC_ARN__|${SNS_ARN}|g" \
              -e "s|__API_GATEWAY_URL__|${API_GATEWAY_URL}|g" \
              k8s/configmap.yaml | kubectl apply -f -

      - name: Secret do Kubernetes
        run: |
          kubectl create secret generic oficina-secret \
            --namespace "$K8S_NAMESPACE" \
            --from-literal=DATABASE_URL='${{ steps.db.outputs.database_url }}' \
            --from-literal=JWT_SECRET='${{ steps.jwt.outputs.jwt_secret }}' \
            --from-literal=ADMIN_SENHA='${{ secrets.ADMIN_SENHA }}' \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Migrations (Job)
        id: migrate
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.ssm.outputs.ecr }}
        run: |
          kubectl delete job oficina-migrate \
            --namespace "$K8S_NAMESPACE" --ignore-not-found
          sed "s|ECR_REPOSITORY_URL:latest|$ECR_REPOSITORY:$IMAGE_TAG|g" \
            k8s/migration-job.yaml | kubectl apply -f -
          kubectl wait --for=condition=complete job/oficina-migrate \
            --namespace "$K8S_NAMESPACE" --timeout=300s

      - name: Deployment, Service, PDB e HPA
        id: rollout
        env:
          IMAGE_TAG: ${{ github.sha }}
          ECR_REPOSITORY: ${{ steps.ssm.outputs.ecr }}
        run: |
          sed "s|ECR_REPOSITORY_URL:latest|$ECR_REPOSITORY:$IMAGE_TAG|g" \
            k8s/deployment.yaml | kubectl apply -f -
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/pdb.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Aguardar rollout
        run: |
          kubectl rollout status deployment/oficina-api \
            --namespace "$K8S_NAMESPACE" --timeout=180s

      - name: Smoke test — health readiness
        id: smoke
        run: |
          kubectl run smoke-test-${{ github.run_id }} \
            --namespace "$K8S_NAMESPACE" \
            --image=curlimages/curl:8.5.0 \
            --restart=Never \
            --command -- sleep 300
          kubectl wait --for=condition=Ready pod/smoke-test-${{ github.run_id }} \
            --namespace "$K8S_NAMESPACE" --timeout=60s
          kubectl exec smoke-test-${{ github.run_id }} -n "$K8S_NAMESPACE" -- \
            curl -sf "http://oficina-api/health/ready"
          kubectl delete pod smoke-test-${{ github.run_id }} -n "$K8S_NAMESPACE"

      - name: Rollback automatico em falha pos-migration
        if: failure() && steps.migrate.outcome == 'success'
        run: |
          echo "Falha detectada apos migration — revertendo Deployment para revisao anterior."
          kubectl rollout undo deployment/oficina-api \
            --namespace "$K8S_NAMESPACE" || true
          kubectl rollout status deployment/oficina-api \
            --namespace "$K8S_NAMESPACE" --timeout=180s || true
