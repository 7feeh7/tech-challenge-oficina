# EXEMPLO — não commite valores reais.
#
# Em produção este Secret é criado/atualizado automaticamente pelo pipeline de
# CI/CD a partir dos GitHub Secrets (ver .github/workflows/deploy.yml).
#
# Para criar manualmente (ex.: teste local no cluster):
#
#   kubectl create secret generic oficina-secret \
#     --namespace oficina \
#     --from-literal=DATABASE_URL='postgresql://user:pass@host:5432/oficina?schema=public' \
#     --from-literal=JWT_SECRET='troque-este-segredo' \
#     --from-literal=SENDGRID_API_KEY='SG.xxxx' \
#     --from-literal=ADMIN_SENHA='admin12345'
#
# Ou aplique este arquivo substituindo os placeholders (stringData aceita texto puro):
apiVersion: v1
kind: Secret
metadata:
  name: oficina-secret
  namespace: oficina
  labels:
    app: oficina-api
type: Opaque
stringData:
  DATABASE_URL: "postgresql://USUARIO:SENHA@HOST_RDS:5432/oficina?schema=public"
  JWT_SECRET: "troque-este-segredo-em-producao"
  SENDGRID_API_KEY: ""
  ADMIN_SENHA: "admin12345"
