apiVersion: v1
kind: ServiceAccount
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
  annotations:
    # Substituído pelo deploy.yml com o ARN de /infra/os_service_irsa_role_arn (SSM).
    # Só os pods da API usam esta ServiceAccount; o Job de migration não.
    eks.amazonaws.com/role-arn: OS_SERVICE_IRSA_ROLE_ARN
