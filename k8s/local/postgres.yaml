# PostgreSQL para uso LOCAL apenas (validar o cluster e o HPA sem AWS/RDS).
# NAO use em producao — em produção o banco é o Amazon RDS.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: oficina
  labels:
    app: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: oficina
            - name: POSTGRES_PASSWORD
              value: oficina
            - name: POSTGRES_DB
              value: oficina
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "oficina", "-d", "oficina"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: oficina
  labels:
    app: postgres
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
