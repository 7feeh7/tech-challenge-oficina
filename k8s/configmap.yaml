apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-config
  namespace: oficina
  labels:
    app: oficina-api
# Variáveis NÃO sensíveis da aplicação.
# Dados sensíveis (DATABASE_URL, JWT_SECRET, SENDGRID_API_KEY, ADMIN_SENHA)
# ficam no Secret (secret.example.yaml), criado pelo pipeline de CI/CD.
data:
  PORT: "3000"
  NODE_ENV: "production"
  DATABASE_SSL: "true"
  ADMIN_NOME: "Administrador"
  ADMIN_EMAIL: "admin@oficina.com"
  SENDGRID_FROM_EMAIL: "oficina@seu-dominio.com"
