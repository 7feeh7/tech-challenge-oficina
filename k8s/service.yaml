apiVersion: v1
kind: Service
metadata:
  name: oficina-api
  namespace: oficina
  labels:
    app: oficina-api
spec:
  # LoadBalancer provisiona um AWS ELB apontando para os pods da API.
  type: LoadBalancer
  selector:
    app: oficina-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
